<title>Платформер</title>
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121c;--fg:#eadff2;--btn:#2b2234cc}}

html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:8px}
canvas{width:100%;max-width:960px;aspect-ratio:16/9;border-radius:12px;touch-action:none;background:#222}
.pad{display:flex;justify-content:space-between;width:100%;max-width:960px;margin-top:10px;gap:10px}
.g{display:flex;gap:10px}
button{width:68px;height:68px;border-radius:50%;border:2px solid #d66aa8;background:var(--btn);color:var(--fg);font-size:26px;user-select:none;-webkit-user-select:none;touch-action:none}
button.on{background:#f48fc4}
p{font-size:13px;opacity:.75;margin:8px 0 0;text-align:center}
canvas{width:auto;height:min(calc(100vh - 110px),56.25vw);max-width:100%}
body{overscroll-behavior:none}

addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=0});

 const k=b.dataset.k;

function jl(x,y,l1,l2,w,a1,a2,col,jc,end,up){
 ctx.save();ctx.translate(x,y);ctx.rotate(a1);
 rr(-w/2,0,w,l1,w/2,col);
 if(up)up();

 ctx.fillStyle=jc;ctx.beginPath();ctx.arc(0,0,w*0.42,0,7);ctx.fill();

}

 rr(-9.5,-24,19,10,2,SKIN); // живот

 ctx.fillStyle=SKIN;ctx.beginPath();ctx.moveTo(-12.5,-3);ctx.bezierCurveTo(-13,8,-6,15,0,16);ctx.bezierCurveTo(6,15,13,8,12.5,-3);ctx.bezierCurveTo(12,-13,-12,-13,-12.5,-3);ctx.fill();
 ctx.fillStyle='rgba(255,110,120,.38)';ctx.beginPath();ctx.ellipse(-8,6.5,3.6,2,0,0,7);ctx.ellipse(8,6.5,3.6,2,0,0,7);ctx.fill();

 }
 ctx.strokeStyle='#e0a284';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(0.4,6.5);ctx.lineTo(-0.5,8);ctx.stroke();

 for(const s of [-1,1]){

function drawChar(p){

 const poseOf=lx=>{const ph=t*10+(lx<0?0:Math.PI);if(air)return lx<0?[0.5,0.9]:[-0.3,0.5];if(run)return [Math.sin(ph)*0.6,0.08+Math.max(0,-Math.cos(ph))*1.05];const k=lx<0?0.85:0.7;return [-k*c,0.05+(k+0.8)*c]};
 const reach=lx=>{const [a,b]=poseOf(lx);return 19*Math.cos(a)+19*Math.cos(a+b)};
 const hipY=air?-34:-Math.max(reach(-6),reach(6));

 ctx.lineTo(14+sway*3,hy+52*p.hs);ctx.bezierCurveTo(22+sway*2,hy+34*p.hs,24+sway,hy+10,14,hy-8);ctx.fill();
 ctx.restore();
 // legs
 const sw=run?Math.sin(t*10)*0.75:0;
 const L=38-12*c;
 const legs=[[-6,air?0.55:sw,PANT2],[6,air?-0.25:-sw,PANT]];
 for(const [lx,a,col] of legs){
  const [a1,a2]=poseOf(lx);
  jl(lx,hipY-bob*0.5,19,19,17,a1,a2,col,lx<0?'#26262c':'#3a3a44',
   ()=>{ctx.translate(0,19);ctx.rotate(-(a1+a2)*(run||air?0.6:1));rr(-7,-4,16,8,4,'#f2f2f5');rr(-7,0,16,3,1.5,'#c9c9d2')},
   ()=>{ctx.fillStyle='#222228';ctx.fillRect(lx<0?-7:1,6,6,9)});

 }

 ctx.save();ctx.translate(0,hipY-bob);ctx.rotate(lean);

function update(dt){
 const sp=P.c>0.5&&P.ground?90:230;
 const mv=(keys.right?1:0)-(keys.left?1:0);
 const tv=mv*sp;
 P.vx+=(tv-P.vx)*Math.min(1,dt*(P.ground?14:6));
 if(mv)P.dir=mv;
 const crouching=crouchOn&&P.ground;
 P.hx+=((-P.vx*0.03)-P.hx)*Math.min(1,dt*8);
 P.hs+=((1-Math.max(-0.15,Math.min(0.25,P.vy/1500)))-P.hs)*Math.min(1,dt*8);
 P.c+=((crouching?1:0)-P.c)*Math.min(1,dt*14);
 if(keys.jump&&P.ground){if(crouchOn)toggleCrouch();P.vy=-620;P.ground=false}
 P.vy+=1700*dt;
 P.x+=P.vx*dt;P.y+=P.vy*dt;
 if(P.y>=GY){P.y=GY;P.vy=0;P.ground=true}
 const hw=18;
 if(P.x<hw){P.x=hw;P.vx=0}
 if(P.x>W-hw){P.x=W-hw;P.vx=0}
 P.state=!P.ground?'air':(Math.abs(P.vx)>20?'run':'idle');
 P.t+=dt*(P.state==='run'?1:0.8);
}
function scene(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffd9ec');g.addColorStop(1,'#cfe3ff');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,.7)';
 [[140,90,50],[190,80,38],[110,100,34],[700,130,46],[750,118,34],[660,140,30]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()});
 ctx.fillStyle='#7a5a8c';ctx.fillRect(0,GY,W,H-GY);
 ctx.fillStyle='#b98fd0';ctx.fillRect(0,GY,W,10);
 ctx.fillStyle='rgba(255,255,255,.12)';for(let x=0;x<W;x+=60)ctx.fillRect(x,GY+10,30,H);
 ctx.strokeStyle='#d66aa8';ctx.lineWidth=6;ctx.strokeRect(3,3,W-6,H-6);
}
let last=performance.now();
function loop(n){
 const dt=Math.min(0.033,(n-last)/1000);last=n;
 update(dt);scene();drawChar2(P);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
