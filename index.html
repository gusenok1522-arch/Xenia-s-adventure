<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Платформер</title>
<style>
:root{--bg:#f3eef6;--fg:#3a2b45;--btn:#ffffffcc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121c;--fg:#eadff2;--btn:#2b2234cc}}
:root[data-theme="dark"]{--bg:#17121c;--fg:#eadff2;--btn:#2b2234cc}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:8px}
canvas{width:min(100%,960px,calc((100vh - 60px)*1.7778));aspect-ratio:16/9;border-radius:12px;touch-action:none;background:#222}
.pad{display:flex;justify-content:space-between;width:100%;max-width:960px;margin-top:10px;gap:10px}
.g{display:flex;gap:10px}
.cb{position:fixed;transform:translate(-50%,-50%);z-index:30;width:var(--bs,68px);height:var(--bs,68px);border-radius:50%;border:2px solid #d66aa8;background:var(--btn);color:var(--fg);font-size:26px;user-select:none;-webkit-user-select:none;touch-action:none}
#ctl{display:none}#ctl.show{display:block}.hid{display:none!important}
#mbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:40;border:2px solid #d66aa8;border-radius:20px;background:var(--btn);color:var(--fg);padding:6px 12px;font-size:14px}
.scr{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(160deg,#ffd9ec,#cfe3ff);color:#3a2b45;padding:16px;text-align:center;overflow:auto}
.scr.top{inset:0 0 auto 0;justify-content:flex-start;background:rgba(255,235,245,.93);border-radius:0 0 16px 16px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);gap:8px;font-size:14px}
.mb{min-width:240px;padding:14px 22px;font-size:18px;border-radius:14px;border:2px solid #d66aa8;background:#fff;color:#3a2b45}
.mb.s{min-width:0;padding:7px 12px;font-size:14px}
.mb.dis{opacity:.55}.mb small{display:block;font-size:12px}
.row,.chip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.chip.a .mb:first-child{background:#f9c3df}
h1,h2{margin:0 0 8px}
.cb.on{background:#f48fc4}
p{font-size:13px;opacity:.75;margin:8px 0 0;text-align:center}
</style></head><body>
<canvas id="c" width="960" height="540"></canvas>
<div id="ctl">
<button class="cb" data-k="left">◀</button><button class="cb" data-k="right">▶</button>
<button class="cb" id="crouchBtn" data-k="down">▼</button><button class="cb" data-k="jump">▲</button>
</div>
<button id="mbtn" class="hid">☰ Меню</button>
<div id="menu" class="scr"><h1>🎀 Платформер</h1>
<button class="mb" id="bPlay">Играть</button>
<button class="mb dis" disabled>Кастомизация персонажа<small>coming soon</small></button>
<button class="mb" id="bSet">Настройки</button><small id="tapHint" class="hid">🔊 Нажмите на экран, чтобы включить музыку</small></div>
<div id="settings" class="scr hid"><h2>Настройки</h2>
<button class="mb" id="bCtl">Управление</button>
<button class="mb" id="bSetBack">Назад</button></div>
<div id="ctlpanel" class="scr top hid"><b>Управление: перетаскивайте кнопки пальцем</b>
<label>Размер кнопок <input id="sz" type="range" min="48" max="120" value="68"></label>
<div class="row"><button class="mb s" id="bSave">Сохранить конфиг</button><button class="mb s" id="bReset">Сбросить</button><button class="mb s" id="bBack2">Назад</button></div>
<div id="cfgList"></div></div>
<p>← → / A D — движение · ↑ / W / Пробел — прыжок · ↓ / S — присесть / встать (переключатель)</p>

const bgm=new Audio(MUSIC);bgm.loop=true;bgm.volume=.6;
let scr='menu',editing=false;
const DEF={left:[.12,.86],right:[.3,.86],down:[.72,.86],jump:[.88,.78]};
const clone=o=>JSON.parse(JSON.stringify(o));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cur=LS.get('plt.cur',{pos:clone(DEF),size:68}),cfgs=LS.get('plt.cfgs',[]),act=LS.get('plt.act',-1);
cur.pos=Object.assign(clone(DEF),cur.pos||{});cur.size=cur.size||68;
function applyLayout(){document.documentElement.style.setProperty('--bs',cur.size+'px');document.querySelectorAll('.cb').forEach(b=>{const p=cur.pos[b.dataset.k];b.style.left=p[0]*100+'%';b.style.top=p[1]*100+'%'})}
function saveCur(){LS.set('plt.cur',cur)}
function startMusic(){bgm.volume=.6;bgm.play().then(()=>$('tapHint').classList.add('hid')).catch(()=>$('tapHint').classList.remove('hid'))}
function fadeMusic(){const iv=setInterval(()=>{if(scr!=='game'){clearInterval(iv);return}bgm.volume=Math.max(0,bgm.volume-.1);if(bgm.volume<=.01){bgm.pause();bgm.currentTime=0;clearInterval(iv)}},60)}
['pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>{if(scr!=='game'&&bgm.paused)startMusic()}));
function go(n){scr=n;editing=n==='ctlpanel';

function update(dt){
 const sp=P.c>0.5&&P.ground?90:230;
 const mv=(keys.right?1:0)-(keys.left?1:0);
 const tv=mv*sp;
 P.vx+=(tv-P.vx)*Math.min(1,dt*(P.ground?14:6));
 if(mv)P.dir=mv;
 const crouching=crouchOn&&P.ground;
 P.hx+=((-P.vx*0.03)-P.hx)*Math.min(1,dt*8);
 P.hs+=((1-Math.max(-0.15,Math.min(0.25,P.vy/1500)))-P.hs)*Math.min(1,dt*8);
 P.c+=((crouching?1:0)-P.c)*Math.min(1,dt*14);
 if(keys.jump&&P.ground){if(crouchOn)toggleCrouch();P.vy=-620;P.ground=false}
 P.vy+=1700*dt;
 P.x+=P.vx*dt;P.y+=P.vy*dt;
 if(P.y>=GY){P.y=GY;P.vy=0;P.ground=true}
 const hw=18;
 if(P.x<hw){P.x=hw;P.vx=0}
 if(P.x>W-hw){P.x=W-hw;P.vx=0}
 P.state=!P.ground?'air':(Math.abs(P.vx)>20?'run':'idle');
 P.t+=dt*(P.state==='run'?1:0.8);
}
function scene(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffd9ec');g.addColorStop(1,'#cfe3ff');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,.7)';
 [[140,90,50],[190,80,38],[110,100,34],[700,130,46],[750,118,34],[660,140,30]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()});
 ctx.fillStyle='#7a5a8c';ctx.fillRect(0,GY,W,H-GY);
 ctx.fillStyle='#b98fd0';ctx.fillRect(0,GY,W,10);
 ctx.fillStyle='rgba(255,255,255,.12)';for(let x=0;x<W;x+=60)ctx.fillRect(x,GY+10,30,H);
 ctx.strokeStyle='#d66aa8';ctx.lineWidth=6;ctx.strokeRect(3,3,W-6,H-6);
}
let last=performance.now();
function loop(n){
 const dt=Math.min(0.033,(n-last)/1000);last=n;
 if(scr==='game'){update(dt);scene();drawChar2(P)}
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
applyLayout();renderCfgs();$('sz').value=cur.size;go('menu');
</script></body></html>
